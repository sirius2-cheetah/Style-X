<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Browser → Intel HEX Uploader (resume対応)</title>
<style>
  body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP"; padding:12px; max-width:1100px; margin:auto;}
  .cols{display:flex; gap:12px;}
  .panel{flex:1; border:1px solid #ddd; padding:12px; border-radius:8px;}
  textarea{width:100%; height:240px; font-family:monospace; font-size:13px;}
  #log{height:240px; overflow:auto; background:#fafafa; padding:8px; border-radius:6px; border:1px solid #eee; white-space:pre-wrap;}
  button{margin:6px 6px 6px 0; padding:8px 12px;}
  .small{font-size:12px; color:#666;}
  progress{width:100%;}
</style>
</head>
<body>
  <h2>HEX生成＆転送（再開対応）</h2>
  <div class="cols">
    <div class="panel">
      <h3>ソース / ブロック出力</h3>
      <p class="small">ブロックから生成した C ソースやスクリプトをここに入れてください。実際はブロック生成関数に差し替えます。</p>
      <textarea id="sourceText">// ここに C ソースまたはスクリプトを入れる
MOVE 50 1000
TURN -30 500
WAIT 0.50
</textarea>
      <div style="margin-top:8px;">
        <button id="buildBtn">ビルド（HEX生成）</button>
        <button id="downloadCBtn">.c をダウンロード</button>
        <button id="downloadHexBtn">.hex をダウンロード</button>
        <input type="file" id="uploadFile" accept=".c,.hex" />
      </div>
      <div class="small" id="buildInfo">未ビルド</div>
    </div>

    <div class="panel">
      <h3>シリアル接続 / 転送</h3>
      <div style="margin-bottom:8px;">
        <button id="connectBtn">ポート接続</button>
        <button id="disconnectBtn" disabled>切断</button>
        <button id="sendBtn" disabled>HEXを送信</button>
        <button id="resumeBtn" disabled>途中から再開</button>
        <button id="abortBtn" disabled>中止</button>
      </div>
      <div class="small">ポート: <span id="portState">未接続</span></div>
      <div style="margin-top:8px;">
        <label class="small">進捗</label>
        <progress id="progressBar" value="0" max="100"></progress>
        <div class="small">行: <span id="progressText">0/0</span></div>
      </div>
      <h4>ログ</h4>
      <div id="log"></div>
    </div>
  </div>

<script>
/* ===== ユーティリティ ===== */
const logEl = document.getElementById('log');
function log(s){ const t = new Date().toLocaleTimeString(); logEl.textContent += `[${t}] ${s}\n`; logEl.scrollTop = logEl.scrollHeight; }

function toHexByte(n){ return ('0' + (n & 0xFF).toString(16).toUpperCase()).slice(-2); }
function toHexWord(n){ return toHexByte((n>>8)&0xFF) + toHexByte(n&0xFF); }

/* ===== Intel HEX レコード作成 ===== */
function makeHexRecord(address, data){
  const len = data.length;
  let sum = len + ((address >> 8) & 0xFF) + (address & 0xFF) + 0x00; // record type 00
  let dataHex = '';
  for (let i=0;i<len;i++){ const b = data[i]; sum += b; dataHex += toHexByte(b); }
  const checksum = ((~(sum & 0xFF) + 1) & 0xFF);
  return ':' + toHexByte(len) + toHexWord(address) + '00' + dataHex + toHexByte(checksum);
}

/* スクリプト/Cソースをバイト列に変換 */
function encodeToBytes(text){ return new TextEncoder().encode(text); }

/* スクリプトを Intel HEX 行群に変換
   baseAddr: 保存先開始アドレス（ランタイムが読む領域に合わせる）
   lineSize: データ長（16/32 推奨） */
function scriptToHexLines(script, baseAddr=0x2000, lineSize=32){
  const bytes = encodeToBytes(script);
  const lines = [];
  let addr = baseAddr;
  for (let offset=0; offset<bytes.length; offset += lineSize){
    const chunk = bytes.slice(offset, offset + lineSize);
    lines.push(makeHexRecord(addr & 0xFFFF, chunk));
    addr += chunk.length;
  }
  lines.push(':00000001FF'); // EOF
  return lines;
}

/* ===== ファイルダウンロード/アップロード ===== */
function downloadFile(filename, text){
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('downloadCBtn').addEventListener('click', ()=>{
  const txt = document.getElementById('sourceText').value;
  downloadFile('program.c', txt);
});

document.getElementById('downloadHexBtn').addEventListener('click', ()=>{
  if (!window._hexLines) { alert('まずビルドしてください'); return; }
  downloadFile('program.hex', window._hexLines.join('\n') + '\n');
});

document.getElementById('uploadFile').addEventListener('change', async (ev)=>{
  const f = ev.target.files[0];
  if (!f) return;
  const txt = await f.text();
  if (f.name.endsWith('.c')) {
    document.getElementById('sourceText').value = txt;
    log('Cソースを読み込みました: ' + f.name);
  } else {
    // hex
    document.getElementById('sourceText').value = '// HEXファイルを読み込みました\n' + txt;
    window._hexLines = txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
    document.getElementById('buildInfo').textContent = `HEX読み込み: ${window._hexLines.length} 行`;
    log('HEXを読み込みました: ' + f.name);
    if (port && writer) document.getElementById('sendBtn').disabled = false;
  }
});

/* ===== ビルド ===== */
document.getElementById('buildBtn').addEventListener('click', ()=>{
  // ここをブロック→ソース生成に差し替え可能
  const script = document.getElementById('sourceText').value;
  // もしCソースをそのままHEXにしたい場合は、バイナリ化ではなく「ランタイムが読むテキスト」を想定
  const lines = scriptToHexLines(script, 0x2000, 32);
  window._hexLines = lines;
  document.getElementById('buildInfo').textContent = `ビルド済み: ${lines.length} 行`;
  log(`ビルド完了: ${lines.length} 行`);
  // 保存（途中再開用）
  localStorage.setItem('lastBuiltHex', JSON.stringify(lines));
  if (port && writer) document.getElementById('sendBtn').disabled = false;
});

/* ===== Web Serial 管理 ===== */
let port = null, writer = null, reader = null;
let pendingResponses = [];
let abortFlag = false;

function handleDeviceMessage(line){
  if (pendingResponses.length){
    const p = pendingResponses.shift();
    p.resolve(line);
  } else {
    log('受信: ' + line);
  }
}
function waitForDeviceMessage(timeoutMs=3000){
  return new Promise((resolve,reject)=>{
    const timer = setTimeout(()=>{ // timeout
      for (let i=0;i<pendingResponses.length;i++){
        if (pendingResponses[i].resolve === resolve){ pendingResponses.splice(i,1); break; }
      }
      reject(new Error('timeout'));
    }, timeoutMs);
    pendingResponses.push({ resolve: (msg)=>{ clearTimeout(timer); resolve(msg); }, reject });
  });
}

async function startReadLoop(){
  const decoder = new TextDecoder();
  try {
    while (port && port.readable){
      reader = port.readable.getReader();
      try {
        let buf = '';
        while (true){
          const { value, done } = await reader.read();
          if (done) break;
          if (value){
            buf += decoder.decode(value, {stream:true});
            let idx;
            while ((idx = buf.indexOf('\n')) >= 0){
              const line = buf.slice(0, idx).trim();
              buf = buf.slice(idx+1);
              if (line.length) handleDeviceMessage(line);
            }
          }
        }
      } finally {
        reader.releaseLock();
      }
    }
  } catch (e){
    log('読み取りループ例外: ' + e);
  }
}

document.getElementById('connectBtn').addEventListener('click', async ()=>{
  try {
    if (!('serial' in navigator)) { alert('Web Serial 非対応ブラウザ'); return; }
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    startReadLoop();
    document.getElementById('disconnectBtn').disabled = false;
    document.getElementById('connectBtn').disabled = true;
    document.getElementById('portState').textContent = '接続中 (115200)';
    log('ポート接続完了');
    if (window._hexLines) document.getElementById('sendBtn').disabled = false;
    document.getElementById('resumeBtn').disabled = false;
  } catch (e) { log('接続失敗: ' + e); }
});

document.getElementById('disconnectBtn').addEventListener('click', async ()=>{
  try {
    abortFlag = true;
    if (reader) { await reader.cancel(); reader = null; }
    if (writer) { writer.releaseLock(); writer = null; }
    if (port) { await port.close(); port = null; }
    document.getElementById('disconnectBtn').disabled = true;
    document.getElementById('connectBtn').disabled = false;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('resumeBtn').disabled = true;
    document.getElementById('abortBtn').disabled = true;
    document.getElementById('portState').textContent = '未接続';
    log('切断しました');
  } catch (e) { log('切断エラー: ' + e); }
});

/* ===== 送信ロジック（行単位、ACK待ち、再送、途中再開対応） ===== */
async function sendHexLines(lines, startIndex=0){
  const MAX_RETRIES = 6;
  abortFlag = false;
  document.getElementById('abortBtn').disabled = false;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('resumeBtn').disabled = true;

  // BEGIN marker
  await writer.write(new TextEncoder().encode('BEGIN_HEX\n'));
  try {
    const resp = await waitForDeviceMessage(2000);
    log('デバイス応答: ' + resp);
  } catch (e) { log('デバイス応答タイムアウト（続行）'); }

  const total = lines.length;
  for (let i = startIndex; i < total; i++){
    if (abortFlag) { log('送信中止'); break; }
    const line = lines[i];
    let attempt = 0;
    let ok = false;
    while (attempt < MAX_RETRIES && !ok && !abortFlag){
      attempt++;
      log(`行 ${i} 送信 attempt=${attempt}`);
      await writer.write(new TextEncoder().encode(line + '\n'));
      try {
        const msg = await waitForDeviceMessage(3000);
        log('応答: ' + msg);
        if (msg === `OK:${i}`) { ok = true; break; }
        if (msg === `ERR:${i}`) { log('行エラー、再送'); continue; }
        // 予期しない応答: 例えば LAST:xxx などは別処理
      } catch (e) {
        log(`ACKタイムアウト 行=${i} attempt=${attempt}`);
      }
    }
    if (!ok){
      throw new Error(`行 ${i} の送信に失敗しました`);
    }
    // 進捗更新
    const pct = Math.round(((i+1)/total)*100);
    document.getElementById('progressBar').value = pct;
    document.getElementById('progressText').textContent = `${i+1}/${total}`;
    // 保存: 最後送信済み行を localStorage に保存（再開用）
    localStorage.setItem('lastSentLine', String(i));
  }

  // EOF は lines に含まれているが、確実のため再確認
  log('全行送信完了。保存応答待ち...');
  try {
    const final = await waitForDeviceMessage(8000);
    log('最終応答: ' + final);
    if (final === 'SAVE_OK') log('保存成功');
    else log('保存失敗: ' + final);
  } catch (e) {
    log('保存応答タイムアウト');
  }

  document.getElementById('abortBtn').disabled = true;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('resumeBtn').disabled = false;
}

/* 途中から再開: デバイスに LAST を問い合わせて、その次の行から送る */
async function resumeFromDevice(lines){
  if (!port || !writer) { alert('ポート接続してください'); return; }
  // ask device for last received line
  await writer.write(new TextEncoder().encode('QUERY_LAST\n'));
  try {
    const resp = await waitForDeviceMessage(2000);
    log('QUERY_LAST 応答: ' + resp);
    if (resp.startsWith('LAST:')) {
      const last = parseInt(resp.split(':')[1], 10);
      const next = last + 1;
      log(`デバイスは行 ${last} まで受領済み。次は ${next} から送信します。`);
      await sendHexLines(lines, next);
    } else {
      log('LAST 応答が得られません。最初から送信します。');
      await sendHexLines(lines, 0);
    }
  } catch (e) {
    log('QUERY_LAST タイムアウト。最初から送信します。');
    await sendHexLines(lines, 0);
  }
}

/* UI ボタン */
document.getElementById('sendBtn').addEventListener('click', async ()=>{
  if (!window._hexLines) { alert('まずビルドしてください'); return; }
  if (!port || !writer) { alert('ポート接続してください'); return; }
  try {
    await sendHexLines(window._hexLines, 0);
  } catch (e) {
    log('送信中断: ' + e);
    document.getElementById('abortBtn').disabled = true;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('resumeBtn').disabled = false;
  }
});

document.getElementById('resumeBtn').addEventListener('click', async ()=>{
  if (!window._hexLines) { alert('まずビルドしてください'); return; }
  if (!port || !writer) { alert('ポート接続してください'); return; }
  try {
    await resumeFromDevice(window._hexLines);
  } catch (e) {
    log('再開失敗: ' + e);
  }
});

document.getElementById('abortBtn').addEventListener('click', ()=>{
  abortFlag = true;
  document.getElementById('abortBtn').disabled = true;
});

/* 初期化: localStorage からビルド済みHEXを復元 */
window.addEventListener('load', ()=>{
  const saved = localStorage.getItem('lastBuiltHex');
  if (saved) {
    try {
      window._hexLines = JSON.parse(saved);
      document.getElementById('buildInfo').textContent = `前回ビルド復元: ${window._hexLines.length} 行`;
      log('前回ビルドを復元しました');
    } catch(e){}
  }
});
</script>
</body>
</html>
