<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style-X - NextGen Robot Programming Platform</title>
    <style>
      :root {
        --bg-dark: #070a13;
        --bg-panel: #111622;
        --bg-block: #1a2130;
        --border-color: #263147;
        --text-main: #f1f5f9;
        --text-muted: #64748b;

        /* サイバーネオンカラーテーマ */
        --color-motor: #008bf8;
        --color-control: #ff8800;
        --color-led: #ff0055;
        --color-var: #00f5d4;
        --color-wait: #fee440;
        --color-terminal: #05070c;
        --neon-glow: 0 0 15px rgba(0, 229, 255, 0.4);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ヘッダー */
      header {
        background-color: var(--bg-panel);
        padding: 12px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--border-color);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .logo {
        font-size: 1.6rem;
        font-weight: 900;
        color: var(--text-main);
        letter-spacing: 2px;
      }
      .logo span {
        color: #00e5ff;
        text-shadow: var(--neon-glow);
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* ボタン共通デザイン */
      .btn {
        padding: 9px 15px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
      }
      .btn-active {
        background: linear-gradient(135deg, #00e5ff, #008bf8);
        color: #000;
        box-shadow: var(--neon-glow);
      }
      .btn-active:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 25px rgba(0, 229, 255, 0.7);
      }
      .btn-secondary {
        background-color: var(--bg-block);
        color: var(--text-main);
        border: 1px solid var(--border-color);
      }
      
      /* ボタン個別ネオンエフェクト */
      .btn-hex { border-color: #ff3838; color: #ff6b6b; }
      .btn-hex:hover { background-color: rgba(255, 56, 56, 0.15); box-shadow: 0 0 10px rgba(255, 56, 56, 0.4); }
      
      .btn-load { border-color: #a855f7; color: #c084fc; }
      .btn-load:hover { background-color: rgba(168, 85, 247, 0.15); box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
      
      .btn-save { border-color: #06b6d4; color: #22d3ee; }
      .btn-save:hover { background-color: rgba(6, 182, 212, 0.15); box-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }
      
      .btn-cfile { border-color: #22c55e; color: #4ade80; }
      .btn-cfile:hover { background-color: rgba(34, 197, 94, 0.15); box-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
      
      .btn-secondary:hover:not(.btn-hex):not(.btn-load):not(.btn-save):not(.btn-cfile) {
        background-color: var(--border-color);
        border-color: #3b4e75;
      }

      /* サイバー区切り線 */
      .nav-divider {
        width: 2px;
        height: 22px;
        background-color: var(--border-color);
        margin: 0 4px;
      }

      /* メインコンテナ */
      .container {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* パレットエリア（左） */
      .palette {
        width: 300px;
        background-color: var(--bg-panel);
        border-right: 2px solid var(--border-color);
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .category {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .category-title {
        font-size: 0.75rem;
        font-weight: 800;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 4px;
      }
      .palette-btn {
        width: 100%;
        text-align: left;
        padding: 12px 16px;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
      }
      .palette-btn:hover {
        filter: brightness(1.1);
        transform: translateX(2px);
      }
      .palette-btn:active {
        transform: scale(0.98);
      }
      .p-motor { background-color: var(--color-motor); }
      .p-control { background-color: var(--color-control); }
      .p-led { background-color: var(--color-led); }
      .p-var { background-color: var(--color-var); color: #000; }
      .p-wait { background-color: var(--color-wait); color: #000; }

      /* ワークスペースエリア（中央） */
      .workspace {
        flex: 1;
        padding: 25px;
        overflow-y: auto;
        background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1.5px, transparent 0);
        background-size: 30px 30px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
        background-color: #0c0f17;
      }
      .ws-empty {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: var(--text-muted);
        pointer-events: none;
      }

      /* ブロック基本デザイン */
      .block {
        background-color: var(--bg-block);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        transition: margin-left 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        width: 100%;
        max-width: 850px;
      }
      .block-core {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        font-weight: bold;
        font-size: 0.95rem;
      }
      .block-label {
        background-color: rgba(0, 0, 0, 0.3);
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 0.8rem;
        letter-spacing: 0.5px;
      }

      /* ブロックアクセントライン */
      .b-motor { border-left: 6px solid var(--color-motor); }
      .b-control { border-left: 6px solid var(--color-control); }
      .b-led { border-left: 6px solid var(--color-led); }
      .b-var { border-left: 6px solid var(--color-var); }
      .b-wait { border-left: 6px solid var(--color-wait); }

      /* 入力フォーム */
      .input-text {
        background-color: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border-color);
        color: white;
        padding: 6px 10px;
        border-radius: 4px;
        font-weight: bold;
        text-align: center;
        outline: none;
        transition: border-color 0.2s;
      }
      .input-text:focus {
        border-color: #00e5ff;
      }
      .input-num { width: 65px; }
      .input-long { width: 160px; text-align: left; font-family: monospace; }
      .select-custom {
        background-color: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border-color);
        color: white;
        padding: 6px 8px;
        border-radius: 4px;
        font-weight: bold;
        outline: none;
        cursor: pointer;
      }
      .select-custom:focus {
        border-color: #00e5ff;
      }

      /* 操作系 */
      .block-ctrls {
        display: flex;
        gap: 4px;
      }
      .btn-ctrl {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 6px;
        font-size: 1rem;
        border-radius: 4px;
        transition: all 0.1s;
      }
      .btn-ctrl:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.08);
      }

      /* 右パネル */
      .right-panel {
        width: 450px;
        background-color: var(--bg-panel);
        border-left: 2px solid var(--border-color);
        display: flex;
        flex-direction: column;
      }
      .panel-tab {
        padding: 12px 20px;
        background-color: rgba(0, 0, 0, 0.3);
        font-size: 0.8rem;
        font-weight: 800;
        border-bottom: 1px solid var(--border-color);
        color: #94a3b8;
        display: flex;
        justify-content: space-between;
        letter-spacing: 1px;
      }
      .code-area {
        flex: 1;
        padding: 20px;
        font-family: 'Consolas', monospace;
        font-size: 0.85rem;
        line-height: 1.6;
        color: #cbd5e1;
        overflow-y: auto;
        white-space: pre;
        background-color: #090d16;
      }
      .terminal-area {
        height: 280px;
        background-color: var(--color-terminal);
        border-top: 2px solid var(--border-color);
        display: flex;
        flex-direction: column;
      }
      .terminal-log {
        flex: 1;
        padding: 15px;
        font-family: 'Consolas', monospace;
        font-size: 0.85rem;
        color: #4ade80;
        overflow-y: auto;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">Style-<span>X</span></div>
      <div class="nav-actions">
        <!-- インタプリタFWの直接書き込み & プロジェクトセーブロード -->
        <button class="btn btn-secondary btn-hex" onclick="flashInterpreterHex()">⚡ インタプリタ書込</button>
        <button class="btn btn-secondary btn-load" onclick="triggerLoadXSY()">📂 プロジェクト読込</button>
        <button class="btn btn-secondary btn-save" onclick="saveXSYFile()">💾 セーブ(.xsy)</button>
        <input type="file" id="xsyFileInput" accept=".xsy" style="display:none;" onchange="loadXSYFile(this)">
        
        <div class="nav-divider"></div>
        
        <!-- 作成したブロックプログラムのバイナリ転送 -->
        <button class="btn btn-secondary" onclick="clearWorkspace()">クリア</button>
        <button class="btn btn-secondary" onclick="toggleSerialConnection()" id="connBtn">🔌 シリアル接続</button>
        <button class="btn btn-active" onclick="sendToRobot()">⚡ ロボットへ転送</button>
        <button class="btn btn-secondary btn-cfile" onclick="downloadCFile()">💾 Cファイル保存</button>
      </div>
    </header>

    <div class="container">
      <!-- 左：パレット -->
      <div class="palette">
        <div class="category">
          <div class="category-title">駆動系</div>
          <button class="palette-btn p-motor" onclick="addBlock('motor')">
            モーター制御
            <span>+</span>
          </button>
        </div>

        <div class="category">
          <div class="category-title">条件分岐・ループ</div>
          <button class="palette-btn p-control" onclick="addBlock('if')">
            IF 条件分岐
            <span>+</span>
          </button>
          <button class="palette-btn p-control" onclick="addBlock('elseif')">
            elseIF 追加
            <span>+</span>
          </button>
          <button class="palette-btn p-control" onclick="addBlock('else')">
            else 追加
            <span>+</span>
          </button>
          <button class="palette-btn p-control" onclick="addBlock('endif')">
            EndIF 閉じ
            <span>+</span>
          </button>
          <button class="palette-btn p-control" onclick="addBlock('while')">
            While ループ開始
            <span>+</span>
          </button>
          <button class="palette-btn p-control" onclick="addBlock('endwhile')">
            EndWhile 閉じ
            <span>+</span>
          </button>
        </div>

        <div class="category">
          <div class="category-title">出力系</div>
          <button class="palette-btn p-led" onclick="addBlock('led')">
            LED個別制御
            <span>+</span>
          </button>
        </div>

        <div class="category">
          <div class="category-title">データ処理</div>
          <button class="palette-btn p-var" onclick="addBlock('variable')">
            変数演算・代入
            <span>+</span>
          </button>
        </div>

        <div class="category">
          <div class="category-title">時間制御</div>
          <button class="palette-btn p-wait" onclick="addBlock('delay')">
            待機タイマー
            <span>+</span>
          </button>
        </div>
      </div>

      <!-- 中央：ワークスペース -->
      <div class="workspace" id="workspace">
        <div class="ws-empty" id="emptyMsg">
          <h3>Style-X ワークスペース</h3>
          <p style="margin-top:8px; font-size:0.9rem;">
            左 of パレットからブロックを追加してプログラムを構築してください。
          </p>
        </div>
      </div>

      <!-- 右パネル：コード出力 & ターミナル -->
      <div class="right-panel">
        <div class="panel-tab"><span>PREVIEW: D18_User.c (大仙ネイティブ互換)</span></div>
        <div class="code-area" id="codeText"></div>

        <div class="terminal-area">
          <div class="panel-tab" style="background-color:rgba(0,0,0,0.4); border-bottom:none;">
            <span>SERIAL MONITOR</span>
            <span id="portStatus" style="color:#ef4444;">DISCONNECTED</span>
          </div>
          <div class="terminal-log" id="termLog">System Initialized. Ready for Style-X execution.</div>
        </div>
      </div>
    </div>

    <script>
      // グローバル状態定義
      let programData = [];
      let serialPort = null;
      let serialWriter = null;
      let serialReader = null;
      let keepReading = false;

      // ⚡ 新設：受信監視中のデータを別機能（ハンドシェイクなど）でも検知するためのコールバック
      let onSerialReceived = null;

      // 大仙仕様：AからZまでの26変数を生成[cite: 1]
      const ALL_VARS = Array.from({ length: 26 }, (_, i) => String.fromCharCode(65 + i));

      // ブロック生成・初期化パラメータ
      function addBlock(type) {
        let block = { id: 'block_' + Date.now() + Math.floor(Math.random() * 100), type: type };

        if (type === 'motor') {
          block.left = 50; block.right = 50;
        } else if (type === 'if' || type === 'elseif') {
          block.condType = 'sensor'; block.sensorNum = 1; block.op = '>'; block.val = 500;
          block.angle = 180; block.range = 15; block.varName = 'A'; block.varOp = '=='; block.varVal = 0;
        } else if (type === 'led') {
          // 大仙LED仕様：1(ON), 0(OFF), 3(そのまま)[cite: 1]
          block.r1 = 1; block.r2 = 1; block.r3 = 0; block.g = 0;
        } else if (type === 'variable') {
          block.target = 'A'; block.op = '='; block.expr = 'cn1 + 10';
        } else if (type === 'delay') {
          block.time = 1.00;
        }

        programData.push(block);
        updateWorkspace();
      }

      // 値の更新
      function updateValue(id, key, value) {
        let target = programData.find(b => b.id === id);
        if (target) {
          if (key === 'left' || key === 'right') {
            let v = parseInt(value);
            if (isNaN(v)) v = 0; if (v > 100) v = 100; if (v < -100) v = -100;
            target[key] = v;
          } else if (key === 'time') {
            let v = parseFloat(value);
            if (isNaN(v) || v < 0) v = 0;
            target[key] = v;
          } else {
            target[key] = value;
          }
          generateCCode(); // 変更時にコードプレビューをリアルタイム更新
        }
      }

      function removeBlock(index) {
        programData.splice(index, 1);
        updateWorkspace();
      }

      function moveUp(index) {
        if (index > 0) {
          let temp = programData[index];
          programData[index] = programData[index - 1];
          programData[index - 1] = temp;
          updateWorkspace();
        }
      }

      function moveDown(index) {
        if (index < programData.length - 1) {
          let temp = programData[index];
          programData[index] = programData[index + 1];
          programData[index + 1] = temp;
          updateWorkspace();
        }
      }

      function clearWorkspace() {
        if (confirm("ワークスペース内のすべてのブロックを削除しますか？")) {
          programData = [];
          updateWorkspace();
        }
      }

      // ワークスペースの動的レンダリング
      function updateWorkspace() {
        const ws = document.getElementById('workspace');
        const emptyMsg = document.getElementById('emptyMsg');

        const blocks = ws.querySelectorAll('.block');
        blocks.forEach(b => b.remove());

        if (programData.length === 0) {
          emptyMsg.style.display = 'block';
          generateCCode();
          return;
        }
        emptyMsg.style.display = 'none';

        let currentIndent = 0;

        programData.forEach((b, index) => {
          if (b.type === 'endif' || b.type === 'endwhile') {
            currentIndent = Math.max(0, currentIndent - 1);
          }
          let rowIndent = currentIndent;
          if (b.type === 'else' || b.type === 'elseif') {
            rowIndent = Math.max(0, currentIndent - 1);
          }

          const blockDiv = document.createElement('div');
          blockDiv.className = `block b-${getBlockCategory(b.type)}`;
          blockDiv.style.marginLeft = `${rowIndent * 24}px`;

          let inner = `<div class="block-core">`;

          if (b.type === 'motor') {
            inner += `<span class="block-label" style="background:var(--color-motor)">モーター制御</span>
              <span>左速度:</span><input type="number" class="input-text input-num" value="${b.left}" oninput="updateValue('${b.id}','left',this.value)"><span>%</span>
              <span>右速度:</span><input type="number" class="input-text input-num" value="${b.right}" oninput="updateValue('${b.id}','right',this.value)"><span>%</span>`;
          }
          else if (b.type === 'if' || b.type === 'elseif') {
            inner += `<span class="block-label" style="background:var(--color-control); text-transform:uppercase;">${b.type} 条件分岐</span>
              <select class="select-custom" onchange="updateValue('${b.id}','condType',this.value); updateWorkspace();">
                <option value="sensor" ${b.condType==='sensor'?'selected':''}>センサーチェック</option>
                <option value="compass" ${b.condType==='compass'?'selected':''}>コンパスチェック</option>
                <option value="variable" ${b.condType==='variable'?'selected':''}>変数チェック</option>
              </select>`;

            if (b.condType === 'sensor') {
              inner += `<span>ポート: CN</span><select class="select-custom" onchange="updateValue('${b.id}','sensorNum',this.value)">`;
              for (let s = 1; s <= 10; s++) inner += `<option value="${s}" ${b.sensorNum==s?'selected':''}>${s}</option>`;
              inner += `</select>
                <select class="select-custom" onchange="updateValue('${b.id}','op',this.value)">
                  <option value=">" ${b.op==='>'?'selected':''}>&gt;</option>
                  <option value="<" ${b.op==='<'?'selected':''}>&lt;</option>
                  <option value="==" ${b.op==='=='?'selected':''}>==</option>
                </select>
                <input type="number" class="input-text input-num" value="${b.val}" oninput="updateValue('${b.id}','val',this.value)">`;
            } else if (b.condType === 'compass') {
              inner += `<span>目標角度:</span><input type="number" class="input-text input-num" value="${b.angle}" oninput="updateValue('${b.id}','angle',this.value)"><span>度</span>
                <span>許容誤差: ±</span><input type="number" class="input-text input-num" value="${b.range}" oninput="updateValue('${b.id}','range',this.value)"><span>度</span>`;
            } else if (b.condType === 'variable') {
              inner += `<span>変数</span><select class="select-custom" onchange="updateValue('${b.id}','varName',this.value)">`;
              ALL_VARS.forEach(v => inner += `<option value="${v}" ${b.varName===v?'selected':''}>${v}</option>`);
              inner += `</select>
                <select class="select-custom" onchange="updateValue('${b.id}','varOp',this.value)">
                  <option value="==" ${b.varOp==='=='?'selected':''}>==</option>
                  <option value="!=" ${b.varOp==='!='?'selected':''}>!=</option>
                  <option value=">" ${b.varOp==='>'?'selected':''}>&gt;</option>
                  <option value="<" ${b.varOp==='<'?'selected':''}>&lt;</option>
                </select>
                <input type="number" class="input-text input-num" value="${b.varVal}" oninput="updateValue('${b.id}','varVal',this.value)">`;
            }
          }
          else if (b.type === 'else') {
            inner += `<span class="block-label" style="background:var(--color-control)">ELSE 条件不一致時</span>`;
          }
          else if (b.type === 'endif') {
            inner += `<span class="block-label" style="background:var(--color-control)">END IF 分岐終了</span>`;
          }
          else if (b.type === 'while') {
            inner += `<span class="block-label" style="background:var(--color-control)">WHILE ループ開始</span>`;
          }
          else if (b.type === 'endwhile') {
            inner += `<span class="block-label" style="background:var(--color-control)">END WHILE ループ終了</span>`;
          }
          else if (b.type === 'led') {
            // 大仙LEDUI：ON(1), OFF(0), そのまま(3) の三択に対応[cite: 1]
            const optLed = (v) => `<option value="1" ${v==1?'selected':''}>点灯 (1)</option><option value="0" ${v==0?'selected':''}>消灯 (0)</option><option value="3" ${v==3?'selected':''}>そのまま (3)</option>`;
            inner += `<span class="block-label" style="background:var(--color-led)">LED設定 (大仙方式)</span>
              <span>RED1:</span><select class="select-custom" onchange="updateValue('${b.id}','r1',this.value)">${optLed(b.r1)}</select>
              <span>RED2:</span><select class="select-custom" onchange="updateValue('${b.id}','r2',this.value)">${optLed(b.r2)}</select>
              <span>RED3:</span><select class="select-custom" onchange="updateValue('${b.id}','r3',this.value)">${optLed(b.r3)}</select>
              <span>GREEN:</span><select class="select-custom" onchange="updateValue('${b.id}','g',this.value)">${optLed(b.g)}</select>`;
          }
          else if (b.type === 'variable') {
            inner += `<span class="block-label" style="background:var(--color-var); color:#000;">変数演算</span>
              <span>変数</span><select class="select-custom" onchange="updateValue('${b.id}','target',this.value)">`;
            ALL_VARS.forEach(v => inner += `<option value="${v}" ${b.target===v?'selected':''}>${v}</option>`);
            inner += `</select>
              <select class="select-custom" onchange="updateValue('${b.id}','op',this.value)">
                <option value="=" ${b.op==='='?'selected':''}>= (代入)</option>
                <option value="+=" ${b.op==='+='?'selected':''}>+= (加算)</option>
                <option value="-=" ${b.op==='-='?'selected':''}>-= (減算)</option>
              </select>
              <span>式:</span><input type="text" class="input-text input-long" value="${b.expr}" placeholder="例: B + 10, cn1, compass" oninput="updateValue('${b.id}','expr',this.value)">`;
          }
          else if (b.type === 'delay') {
            inner += `<span class="block-label" style="background:var(--color-wait); color:#000;">待機タイマー</span>
              <input type="number" step="0.01" class="input-text input-num" value="${b.time}" oninput="updateValue('${b.id}','time',this.value)">
              <span>秒 待つ</span>`;
          }

          inner += `</div>`;

          inner += `<div class="block-ctrls">
            <button class="btn-ctrl" onclick="moveUp(${index})" title="上へ">▲</button>
            <button class="btn-ctrl" onclick="moveDown(${index})" title="下へ">▼</button>
            <button class="btn-ctrl" style="color:#ef4444;" onclick="removeBlock(${index})" title="削除">✖</button>
          </div>`;

          blockDiv.innerHTML = inner;
          ws.appendChild(blockDiv);

          if (b.type === 'if' || b.type === 'while' || b.type === 'else' || b.type === 'elseif') {
            if (b.type === 'if' || b.type === 'while') {
              currentIndent++;
            } else {
              currentIndent = rowIndent + 1;
            }
          }
        });

        generateCCode();
      }

      function getBlockCategory(type) {
        if (type === 'motor') return 'motor';
        if (['if', 'elseif', 'else', 'endif', 'while', 'endwhile'].includes(type)) return 'control';
        if (type === 'led') return 'led';
        if (type === 'variable') return 'var';
        if (type === 'delay') return 'wait';
        return 'main';
      }

      // 大仙のネイティブファームウェア表現に合わせたCコードプレビューの自動合成
      function generateCCode() {
        let code = `//--------------------------------------------------------------------------------\n`;
        code += `// Generated by Style-X Interface (D18_User.c Framework)\n`;
        code += `//--------------------------------------------------------------------------------\n\n`;
        code += `void user_main(void)\n{\n`;

        let indentLevel = 1;

        programData.forEach(b => {
          if (b.type === 'endif' || b.type === 'endwhile') indentLevel = Math.max(1, indentLevel - 1);
          if (b.type === 'else' || b.type === 'elseif') indentLevel = Math.max(1, indentLevel - 1);

          let spacing = "  ".repeat(indentLevel);

          switch (b.type) {
            case 'motor':
              code += `${spacing}motor(${b.left}, ${b.right});\n`;
              break;
            case 'delay':
              code += `${spacing}wait_ms(${Math.floor(b.time * 1000)});\n`; // wait_msに変更[cite: 2]
              break;
            case 'led':
              code += `${spacing}out_LEDs(${b.r1}${b.r2}${b.r3}${b.g});\n`; // 大仙独自の4桁リテラルへ変換[cite: 1, 2]
              break;
            case 'while':
              code += `${spacing}while (TRUE) {\n`;
              indentLevel++;
              break;
            case 'endwhile':
              code += `${spacing}}\n`;
              break;
            case 'else':
              code += `${spacing}} else {\n`;
              indentLevel++;
              break;
            case 'if':
              code += `${spacing}if (${parseCondition(b)}) {\n`;
              indentLevel++;
              break;
            case 'elseif':
              code += `${spacing}} else if (${parseCondition(b)}) {\n`;
              indentLevel++;
              break;
            case 'endif':
              code += `${spacing}}\n`;
              break;
            case 'variable':
              code += `${spacing}gV[VAR_${b.target}] ${b.op} ${b.expr};\n`; // 大仙ネイティブのgV配列へ[cite: 1, 2]
              break;
          }
        });

        code += `}`;
        document.getElementById('codeText').textContent = code;
        return code;
      }

      function parseCondition(b) {
        if (b.condType === 'sensor') {
          return `gAD[CN${b.sensorNum}] ${b.op} ${b.val}`; // gADマッピング[cite: 2]
        } else if (b.condType === 'compass') {
          return `abs(get_compass() - ${b.angle}) <= ${b.range}`;
        } else if (b.condType === 'variable') {
          return `gV[VAR_${b.varName}] ${b.varOp} ${b.varVal}`;
        }
        return "TRUE";
      }

      function downloadCFile() {
        const code = generateCCode();
        const blob = new Blob([code], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'D18_User.c';
        a.click();
        URL.revokeObjectURL(url);
        logTerminal("System: Source code framework exported as 'D18_User.c'.");
      }

      function logTerminal(msg, isRx = false) {
        const log = document.getElementById('termLog');
        const prefix = isRx ? "RX < " : "SYS > ";
        log.innerHTML += `<br><span style="color:${isRx ? '#38bdf8' : '#4ade80'}">${prefix}${msg}</span>`;
        log.scrollTop = log.scrollHeight;
      }

      // === Web Serial API 制御 ======================================
      async function toggleSerialConnection() {
        if (serialPort) {
          keepReading = false;
          if (serialReader) { await serialReader.cancel(); }
          if (serialWriter) { await serialWriter.close(); }
          await serialPort.close();
          serialPort = null; serialWriter = null; serialReader = null;

          document.getElementById('connBtn').textContent = "🔌 シリアル接続";
          document.getElementById('portStatus').textContent = "DISCONNECTED";
          document.getElementById('portStatus').style.color = "#ef4444";
          logTerminal("System: Port closed.");
        } else {
          if (!("serial" in navigator)) {
            alert("Web Serial APIはこのブラウザでサポートされていません。ChromeかEdgeを使用してください。");
            return;
          }
          try {
            serialPort = await navigator.serial.requestPort();
            await serialPort.open({ baudRate: 115200 });
            serialWriter = serialPort.writable.getWriter();

            document.getElementById('connBtn').textContent = "🔌 切断する";
            document.getElementById('portStatus').textContent = "CONNECTED (115200bps)";
            document.getElementById('portStatus').style.color = "#10b981";
            logTerminal("System: Connection established with TJ3B board.");

            keepReading = true;
            serialReadLoop();
          } catch (e) {
            logTerminal("Error: " + e.message);
            serialPort = null;
          }
        }
      }

      async function serialReadLoop() {
        while (serialPort && keepReading) {
          try {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = serialPort.readable.pipeTo(textDecoder.writable);
            serialReader = textDecoder.readable.getReader();

            while (true) {
              const { value, done } = await serialReader.read();
              if (done) { break; }
              if (value) {
                logTerminal(value.trim(), true);
                
                // ⚡ 新設：登録されたイベントリスナーがあれば受信データを流す
                if (onSerialReceived) {
                  onSerialReceived(value);
                }
              }
            }
          } catch (e) {
            break;
          } finally {
            if (serialReader) serialReader.releaseLock();
          }
        }
      }

      // 各ブロック情報を12バイトのバイナリ(Uint8Array)にエンコードする統合処理
      function compileBlock(b) {
        let arr = new Uint8Array(12);

        if (b.type === 'motor') {
          arr[0] = 1;
          arr[1] = b.left < 0 ? 256 + b.left : b.left;
          arr[2] = b.right < 0 ? 256 + b.right : b.right;
        } 
        else if (b.type === 'delay') {
          arr[0] = 2;
          let ms = Math.floor(b.time * 1000);
          arr[1] = (ms >> 8) & 0xFF;
          arr[2] = ms & 0xFF;
        } 
        else if (b.type === 'led') {
          arr[0] = 3;
          arr[1] = parseInt(b.r1);
          arr[2] = parseInt(b.r2);
          arr[3] = parseInt(b.r3);
          arr[4] = parseInt(b.g);
        } 
        else if (b.type === 'if' || b.type === 'elseif') {
          arr[0] = (b.type === 'if') ? 4 : 6;
          let cType = 1; // 1:sensor, 2:compass, 3:variable
          
          if (b.condType === 'sensor') {
            cType = 1;
            arr[2] = b.sensorNum;
            let opMap = { '>': 1, '<': 2, '==': 3 };
            arr[3] = opMap[b.op] || 3;
            arr[4] = (b.val >> 8) & 0xFF;
            arr[5] = b.val & 0xFF;
          } else if (b.condType === 'compass') {
            cType = 2;
            arr[2] = (b.angle >> 8) & 0xFF;
            arr[3] = b.angle & 0xFF;
            arr[4] = b.range;
          } else if (b.condType === 'variable') {
            cType = 3;
            // 26変数対応：アルファベット順インデックス[cite: 1]
            let varIdx = ALL_VARS.indexOf(b.varName) + 1;
            arr[2] = varIdx;
            let opMap = { '==': 1, '!=': 2, '>': 3, '<': 4 };
            arr[3] = opMap[b.varOp] || 1;
            let vVal = parseInt(b.varVal) || 0;
            let uVal = vVal < 0 ? 65536 + vVal : vVal;
            arr[4] = (uVal >> 8) & 0xFF;
            arr[5] = uVal & 0xFF;
          }
          arr[1] = cType;
          arr[9] = b.jumpTarget !== undefined ? b.jumpTarget : 0;
          arr[10] = b.endTarget !== undefined ? b.endTarget : 0;
        } 
        else if (b.type === 'else') {
          arr[0] = 5;
          arr[10] = b.endTarget !== undefined ? b.endTarget : 0;
        } 
        else if (b.type === 'endif') {
          arr[0] = 7;
        } 
        else if (b.type === 'while') {
          arr[0] = 8;
        } 
        else if (b.type === 'endwhile') {
          arr[0] = 9;
          arr[9] = b.jumpTarget !== undefined ? b.jumpTarget : 0;
        } 
        else if (b.type === 'variable') {
          arr[0] = 10;
          let varIdx = ALL_VARS.indexOf(b.target) + 1;
          arr[1] = varIdx;
          let opMap = { '=': 1, '+=': 2, '-=': 3 };
          arr[2] = opMap[b.op] || 1;
          
          let src1_type = 1;
          let src1_val = 0;
          let op2 = 0;
          let src2_type = 1;
          let src2_val = 0;

          let cleanExpr = b.expr.replace(/\s+/g, '');
          let match = cleanExpr.match(/^([a-zA-Z0-9_]+)([\+\-])([a-zA-Z0-9_]+)$/);
          if (match) {
            let part1 = match[1];
            let opSign = match[2];
            let part2 = match[3];
            op2 = (opSign === '+') ? 1 : 2;
            parsePart(part1, 1);
            parsePart(part2, 2);
          } else {
            parsePart(cleanExpr, 1);
          }

          function parsePart(part, num) {
            let type = 1;
            let val = 0;
            if (part.match(/^cn([1-9]|10)$/i)) { // CN10まで拡張に対応
              type = 2;
              val = parseInt(part.match(/^cn([1-9]|10)$/i)[1]);
            } else if (part.match(/^compass$/i)) {
              type = 4; // 新仕様：コンパス状態の代入に完全対応[cite: 1]
              val = 0;
            } else if (part.length === 1 && part.match(/^[A-Za-z]$/)) {
              type = 3;
              val = ALL_VARS.indexOf(part.toUpperCase()) + 1;
            } else {
              type = 1;
              val = parseInt(part) || 0;
            }
            if (num === 1) {
              src1_type = type; src1_val = val;
            } else {
              src2_type = type; src2_val = val;
            }
          }
          
          arr[3] = src1_type;
          arr[4] = src1_val < 0 ? 256 + src1_val : src1_val;
          arr[5] = op2;
          arr[6] = src2_type;
          arr[7] = src2_val < 0 ? 256 + src2_val : src2_val;
        }
        
        return arr;
      }

      // ロボットへの固定長バイナリストリーム転送
      async function sendToRobot() {
        if (!serialWriter) {
          alert("先にロボットをシリアル接続してください。");
          return;
        }

        logTerminal("System: Compiling & Starting binary data stream transfer...");

        try {
          let stack = [];
          for (let i = 0; i < programData.length; i++) {
            let b = programData[i];

            if (b.type === 'if' || b.type === 'while') {
              stack.push({ type: b.type, nodes: [i] });
            }
            else if (b.type === 'elseif' || b.type === 'else') {
              let top = stack[stack.length - 1];
              if (top && top.type === 'if') {
                top.nodes.push(i);
              }
            }
            else if (b.type === 'endif') {
              let top = stack.pop();
              if (top && top.type === 'if') {
                let nodes = top.nodes;
                for (let j = 0; j < nodes.length; j++) {
                  let currIdx = nodes[j];
                  let nextIdx = (j + 1 < nodes.length) ? nodes[j + 1] : i;

                  if (programData[currIdx].type !== 'else') {
                    programData[currIdx].jumpTarget = nextIdx;
                  }
                  programData[currIdx].endTarget = i;
                }
              }
            }
            else if (b.type === 'endwhile') {
              let top = stack.pop();
              if (top && top.type === 'while') {
                let whileIdx = top.nodes[0];
                programData[whileIdx].jumpTarget = i + 1;
                programData[i].jumpTarget = whileIdx;
              }
            }
          }

          let startPacket = new Uint8Array(12);
          startPacket[0] = 250; // 送信開始フラグ
          await serialWriter.write(startPacket);
          await new Promise(r => setTimeout(r, 100));

          for (let i = 0; i < programData.length; i++) {
            const b = programData[i];
            let binaryBlock = compileBlock(b);

            await serialWriter.write(binaryBlock);
            logTerminal(`Transmitted binary line ${i}: [${binaryBlock.join(', ')}]`);
            await new Promise(r => setTimeout(r, 60));
          }

          let endPacket = new Uint8Array(12);
          endPacket[0] = 255; // 送信完了フラグ
          await serialWriter.write(endPacket);

          logTerminal("System: All programming chunks deployed to the target device memory successfully.");
          alert("ロボットへのダウンロードが完了しました！\n機体のスタートボタンを押すとプログラムを実行します。");

        } catch (e) {
          logTerminal("Transfer Failed: " + e.message);
        }
      }

      // ==============================================================
      // ⚡⚡ 【進化版】マイコンへのFW自動ハンドシェイク直接書込
      // ==============================================================

      // 1. オート・ネゴシエーション（ハンドシェイク）によるFW書き込みプロセス
      async function flashInterpreterHex() {
        if (!serialWriter) {
          alert("先にロボットをシリアル接続してください。");
          return;
        }

        alert("【書き込み手順】\n1. ロボットの電源を一度OFF（またはリセットボタン長押し）にしてください。\n2. このメッセージの「OK」ボタンを押します。\n3. すぐにロボットの電源をON（またはリセットボタンを離す）にしてください。\n\n※Webアプリがブートプロンプトを自動検知して書き込みを開始します。");

        logTerminal("System: Waiting for bootloader handshake ('Update?(y/n)' prompt)...");

        // 自動的にDTR/RTSをトグルしてリセットを試みる（回路設計が対応している場合用）
        try {
          await serialPort.setSignals({ dataTerminalReady: false, requestToSend: false });
          await new Promise(r => setTimeout(r, 200));
          await serialPort.setSignals({ dataTerminalReady: true, requestToSend: true });
        } catch(e) {
          // 非サポート環境でもスルー
        }

        // コールバックをセットして、マイコン側からの "Update?(y/n)" プロンプトの到着を待つ
        onSerialReceived = async function(text) {
          if (text.includes("Update?") || text.includes("y/n") || text.includes("Loader")) {
            onSerialReceived = null; // 重複発火を防止するために解除
            logTerminal("System: Bootloader prompt detected! Sending handshake signal 'y'...");
            
            try {
              const encoder = new TextEncoder();
              // マイコンへ書き込み承認「y」を送信！
              await serialWriter.write(encoder.encode("y\r\n"));
              await new Promise(r => setTimeout(r, 500)); // ブートローダーが書き込み待機状態に入るのを少し待つ

              // 本番のHEXストリーミング書き込み処理を開始
              await startActualHexFlashing();
            } catch(err) {
              logTerminal("Handshake Failed: " + err.message);
              onSerialReceived = null;
            }
          }
        };
      }

      // 2. 実際のHEXデータをシリアルに流し込む物理的な書き込みコア
      async function startActualHexFlashing() {
        logTerminal("System: Handshake established. Fetching 'StyleX_Firmware.hex'...");

        try {
          const response = await fetch('StyleX_Firmware.hex');
          if (!response.ok) {
            throw new Error("サーバー上にファームウェア 'StyleX_Firmware.hex' が見つかりません。手動ビルドが成功しているか確認してください。");
          }
          const hexText = await response.text();
          const lines = hexText.split(/\r?\n/);
          
          logTerminal(`System: Unlocked flashing channel. Streaming ${lines.length} hex lines directly to MCU...`);
          
          const encoder = new TextEncoder();
          
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.length === 0) continue;

            // 各Intel HEXの行を直接マイコンのブート領域へ書き込み
            await serialWriter.write(encoder.encode(line + '\r\n'));
            
            // 進捗モニターを刻む
            if (i % 30 === 0 || i === lines.length - 1) {
              logTerminal(`Flashing Progress: ${Math.floor((i / lines.length) * 100)}% (${i}/${lines.length} lines processed)`);
            }
            
            // マイコンの物理メモリへのFlash書き込み反映時間を待つディレイ(25ms)
            await new Promise(r => setTimeout(r, 25));
          }

          logTerminal("System: FLASH FIRMWARE SUCCESSFUL! Core Engine has completely nested into the MCU.");
          alert("マイコンへのインタプリタ本体の直接書き込みが完了しました！\n一度ロボットの電源を切り、再起動させて稼働サイン(LED一瞬点灯)を確認してください。");

        } catch (e) {
          logTerminal("Flashing Failed: " + e.message);
          alert("書き込みプロセス中にエラーが発生しました: " + e.message);
        } finally {
          onSerialReceived = null; // 状態のクリーンアップ
        }
      }

      // 3. 現在配置されているブロックデータをJSON文字列に変換し、オリジナル拡張子「.XSY」で保存する関数
      function saveXSYFile() {
        if (programData.length === 0) {
          alert("ワークスペースが空のため、セーブファイルを生成できません。");
          return;
        }
        const jsonStr = JSON.stringify(programData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = 'robot_program.xsy';
        a.click();
        URL.revokeObjectURL(url);
        logTerminal("System: Current structural workspace successfully deployed to 'robot_program.xsy'.");
      }

      // 4. 隠しファイルインプットをクリックさせてロードダイアログを展開するトリガー
      function triggerLoadXSY() {
        document.getElementById('xsyFileInput').click();
      }

      // 5. アップロードされた「.XSY」ファイルを読み込んで、ワークスペースをフルリカバリするハンドラー
      function loadXSYFile(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const loadedData = JSON.parse(e.target.result);
            
            if (Array.isArray(loadedData)) {
              programData = loadedData;
              updateWorkspace();
              logTerminal("System: Workspace successfully reconstructed from local .xsy file.");
            } else {
              alert("ファイル形式の検証に失敗しました。有効なStyle-Xプロジェクトではありません。");
            }
          } catch (err) {
            alert("JSON構造の解析中に致命的なエラーが発生しました: " + err.message);
          }
          input.value = '';
        };
        reader.readAsText(file);
      }

      // 初期レンダリング
      updateWorkspace();
    </script>
  </body>
